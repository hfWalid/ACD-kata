# SonarQube analysis settings for the whole repository.
#
# How the pieces fit, because this file is where a beginner usually gets lost:
#
#   sources/tests  what the scanner reads and sends to the server for analysis
#   java.binaries  where the compiled classes are: the Java analyzer needs bytecode, not only text
#   coverage       nothing is measured here: the reports must be produced *before* the scan by
#                  JaCoCo (backend) and Vitest (frontend), and merely be *imported*
#   exclusions     generated or third-party code, so the metrics mean something
#
# Order matters: run `./mvnw verify` and `npm --prefix web run coverage` first, then the scanner.

sonar.projectKey=acd-kata
sonar.projectName=ACD Kata
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.sources=\
  contribution-service/domain/src/main/java,\
  contribution-service/application/src/main/java,\
  contribution-service/adapters-rest/src/main/java,\
  contribution-service/adapters-persistence/src/main/java,\
  contribution-service/adapters-messaging/src/main/java,\
  contribution-service/adapters-import/src/main/java,\
  contribution-service/boot/src/main/java,\
  review-service/src/main/java,\
  web/src

sonar.tests=\
  contribution-service/domain/src/test/java,\
  contribution-service/application/src/test/java,\
  contribution-service/adapters-rest/src/test/java,\
  contribution-service/adapters-persistence/src/test/java,\
  contribution-service/adapters-messaging/src/test/java,\
  contribution-service/adapters-import/src/test/java,\
  contribution-service/boot/src/test/java,\
  review-service/src/test/java,\
  web/cypress

# The web tests live next to the code they test. SonarQube classifies a file as a test when it is
# matched here, and the matching `sonar.exclusions` keeps it out of the production metrics.
sonar.test.inclusions=**/*.spec.ts,**/*.cy.ts,**/*Test.java,**/*IT.java
sonar.exclusions=**/*.spec.ts,**/*.cy.ts,**/target/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/.scannerwork/**

sonar.java.binaries=\
  contribution-service/domain/target/classes,\
  contribution-service/application/target/classes,\
  contribution-service/adapters-rest/target/classes,\
  contribution-service/adapters-persistence/target/classes,\
  contribution-service/adapters-messaging/target/classes,\
  contribution-service/adapters-import/target/classes,\
  contribution-service/boot/target/classes,\
  review-service/target/classes

sonar.java.test.binaries=\
  contribution-service/domain/target/test-classes,\
  contribution-service/application/target/test-classes,\
  contribution-service/adapters-rest/target/test-classes,\
  contribution-service/adapters-persistence/target/test-classes,\
  contribution-service/adapters-messaging/target/test-classes,\
  contribution-service/adapters-import/target/test-classes,\
  contribution-service/boot/target/test-classes,\
  review-service/target/test-classes

# Reports produced by the build, imported as-is. SonarQube never runs the tests itself.
sonar.coverage.jacoco.xmlReportPaths=\
  contribution-service/domain/target/site/jacoco/jacoco.xml,\
  contribution-service/application/target/site/jacoco/jacoco.xml,\
  contribution-service/adapters-rest/target/site/jacoco/jacoco.xml,\
  contribution-service/adapters-persistence/target/site/jacoco/jacoco.xml,\
  contribution-service/adapters-messaging/target/site/jacoco/jacoco.xml,\
  contribution-service/adapters-import/target/site/jacoco/jacoco.xml,\
  contribution-service/boot/target/site/jacoco/jacoco.xml,\
  review-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/acd-web/lcov.info

# Test *execution* results, a different thing from coverage: JaCoCo says which lines ran, these
# files say which tests failed. Surefire and Failsafe already write JUnit XML, so nothing extra
# runs — the scanner simply reads the reports. The frontend is not imported here: SonarQube reads
# JS/TS execution results only in its generic format, which would need a converter for Vitest.
sonar.junit.reportPaths=\
  contribution-service/domain/target/surefire-reports,\
  contribution-service/application/target/surefire-reports,\
  contribution-service/adapters-rest/target/surefire-reports,\
  contribution-service/adapters-persistence/target/surefire-reports,\
  contribution-service/adapters-messaging/target/surefire-reports,\
  contribution-service/adapters-import/target/surefire-reports,\
  contribution-service/boot/target/surefire-reports,\
  contribution-service/boot/target/failsafe-reports,\
  review-service/target/surefire-reports,\
  review-service/target/failsafe-reports
