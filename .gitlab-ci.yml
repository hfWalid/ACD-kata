stages:
  - verify
  - quality

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

backend-verify:
  stage: verify
  image: maven:3.9.16-eclipse-temurin-21
  services:
    - name: docker:29.6.2-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  cache:
    key: maven-java21
    paths:
      - .m2/repository/
  script:
    - ./mvnw --batch-mode --no-transfer-progress -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" verify
  artifacts:
    when: always
    reports:
      junit:
        - contribution-service/*/target/surefire-reports/TEST-*.xml
        - contribution-service/*/target/failsafe-reports/TEST-*.xml
        - review-service/target/surefire-reports/TEST-*.xml
        - review-service/target/failsafe-reports/TEST-*.xml
    paths:
      - contribution-service/*/target/site/jacoco/
      - review-service/target/site/jacoco/
      - contribution-service/*/target/classes/
      - contribution-service/*/target/test-classes/
      - review-service/target/classes/
      - review-service/target/test-classes/

web-verify:
  stage: verify
  image: node:24.19.0-bookworm-slim
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .npm/
  script:
    - node --test scripts/init-local-env.test.mjs
    - npm --prefix web ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm --prefix web run format:check
    # `coverage` runs the same tests and writes lcov for the quality job; running both would
    # execute the suite twice for nothing.
    - npm --prefix web run coverage
    - npm --prefix web run build
  artifacts:
    paths:
      - web/dist/
      - web/coverage/acd-web/lcov.info

compose-validate:
  stage: verify
  image: docker:29.6.2-cli
  script:
    - docker compose --env-file .env.example config --quiet

# S10 — static analysis. Prepared, never executed remotely: the job only runs when the two
# variables exist, so a repository without a SonarQube server keeps a green pipeline.
# SONAR_HOST_URL is a normal CI/CD variable; SONAR_TOKEN must be masked and protected.
sonar-analysis:
  stage: quality
  image: sonarsource/sonar-scanner-cli:12.4
  needs:
    - job: backend-verify
      artifacts: true
    - job: web-verify
      artifacts: true
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: sonar
    paths:
      - .sonar/cache/
  script:
    # The quality gate is the point of the job: without this flag the scan reports and exits 0
    # whatever the gate decides, which turns the control into a decoration.
    - sonar-scanner -Dsonar.qualitygate.wait=true
