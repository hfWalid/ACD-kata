name: acd-kata

services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: acd_contribution
      POSTGRES_USER: acd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - contribution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The image trusts loopback connections inside the container. Use its bridge
      # address to exercise password authentication instead of that trust rule.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql
          --host "$$(hostname -i)" --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}" --no-password --tuples-only --no-align
          --command "SELECT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Quality analysis server, started on demand: `make quality-up` (Compose profile "quality").
  # The community edition keeps its data in an embedded database, which is fine for a local
  # learning instance and explicitly not a production setup.
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    profiles: ["quality"]
    environment:
      # Docker on macOS cannot raise vm.max_map_count, which Elasticsearch checks at boot.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  contribution-postgres-data:
  sonarqube-data:
  sonarqube-logs:
