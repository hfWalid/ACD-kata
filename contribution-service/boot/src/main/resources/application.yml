spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: acd-contribution
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:55432}/acd_contribution
    username: ${POSTGRES_USER:acd}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

acd:
  events:
    topic: ${KAFKA_EVENTS_TOPIC:acd.document.lifecycle.v1}
    send-timeout: 5s
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      batch-size: 50
      interval: 2s
      initial-delay: 2s
      lease: 30s
      base-backoff: 1s
      max-backoff: 5m

springdoc:
  api-docs:
    version: OPENAPI_3_0
